name: 构建与发布学习网站

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 学习网站-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建与发布
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 配置运行环境
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装锁定的依赖
        run: npm ci
      - name: 构建网站
        run: npm run build
      - name: 发布到 Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
